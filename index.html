<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="clasificador.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Idiqlat:wght@200;300;400&family=Londrina+Solid:wght@100;300;400;900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">


    <title>Clasificador de Empresas</title>
</head>

<body>

    <form class="formulario">

        <div class="input-group">
            <input type="text" id="nombre" placeholder="Nombre">
        </div>

        <div class="input-group">
            <input type="number" id="colaboradores" placeholder="Cantidad de colaboradores">
        </div>

        <label>Origen del capital:</label>

        <select id="capital">
            <option value="publico">Público</option>
            <option value="privado">Privado</option>
            <option value="mixto">Mixto</option>
        </select>

        <label>Con o sin fines de lucro:</label>

        <select id="fines_lucro">
            <option value="con">Con fines de lucro</option>
            <option value="sin">Sin fines de lucro</option>
        </select>

        <button type="button" onclick="clasificar()">
            Clasificar empresa
        </button>

        <div id="resultado">
            <h2>Resultado de la clasificación</h2>
        </div>
    </form>

</body>

</html>
