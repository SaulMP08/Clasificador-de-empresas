<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Empresas</title>
</head>
<body>
    <form class="formulario">
        <div class="input-group">
            <input type="text" placeholder="Nombre">
        </div>
    
        <div class="input-group">
            <input type="text" placeholder="Cantidad de colaboradores">
        </div>
    
        <div class="input-group">
            <input type="text" placeholder="Origen de la empresa">
        </div>
    
        <div class="input-group">
            <input type="text" placeholder="Origen de la inversión">
        </div>

        <div class="input-group">
            <input type="text" placeholder="Con o sin fines de lucro">
        </div>
    
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
